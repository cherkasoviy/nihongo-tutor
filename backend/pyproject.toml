[project]
name = "nihongo-tutor-backend"
version = "0.1.0"
description = "Nihongo Tutor backend: FastAPI + aiogram webhook + arq worker"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.52,<1",
    "sqlalchemy[asyncio]>=2.0.52,<3",
    "asyncpg>=0.31,<1",
    "alembic>=1.19,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "aiogram>=3.31,<4",
    "arq>=0.28,<1",
    "redis>=5.3,<6",
    "anthropic>=1.4,<2",
    "openai>=3.8,<4",
    "google-cloud-texttospeech>=2.37,<3",
    "fsrs>=6.3,<7",
    "sudachipy>=0.6.11,<1",
    "sudachidict-core>=20260101",
    "jaconv>=0.5,<1",
    "rapidfuzz>=3.14,<4",
    "structlog>=26.1,<27",
    "typer>=0.27,<1",
    "pyjwt>=2.13,<3",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "testcontainers[postgres]>=4.15,<5",
    "factory-boy>=3.3,<4",
    "respx>=0.23,<1",
    "freezegun>=1.5,<2",
    "ruff>=0.16,<1",
    "black>=26.1,<27",
    "mypy>=2.3,<3",
    "asgi-lifespan>=2.1,<3",
]

[project.scripts]
nihongo-content = "app.content_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

# ---------------------------------------------------------------------------
# Lint / format / typecheck
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "T20", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests and invariants
    "S104",   # binding 0.0.0.0 inside containers is intended
    "RUF001", "RUF002", "RUF003",  # Cyrillic/Japanese strings are the whole point
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "ASYNC"]
"alembic/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["app"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["fsrs.*", "sudachipy.*", "jaconv.*", "arq.*", "google.cloud.*", "factory.*", "testcontainers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
    "integration: needs a PostgreSQL instance (testcontainers or TEST_DATABASE_URL)",
]
